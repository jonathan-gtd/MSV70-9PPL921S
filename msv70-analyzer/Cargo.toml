[package]
name = "msv70-analyzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "msv70-analyzer"
path = "src/main.rs"

[dependencies]
eframe      = "0.31"
egui        = "0.31"
egui_plot   = "0.31"
csv         = "1.3"
quick-xml   = "0.37"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rfd         = "0.15"
rayon       = "1"
chrono      = "0.4"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
